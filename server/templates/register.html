<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Eon</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Eon</h1>
            <h2>Создать аккаунт</h2>
            <div id="error-message" class="error-message hidden"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Логин *</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="nickname">Никнейм (как вас будут видеть)</label>
                    <input type="text" id="nickname" name="nickname" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="phone">Телефон (необязательно, для восстановления доступа)</label>
                    <input type="tel" id="phone" name="phone" placeholder="+71234567890" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label for="password">Пароль * (мин. 8 символов, заглавная буква и цифра)</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="password-confirm">Подтвердите пароль</label>
                    <input type="password" id="password-confirm" name="password-confirm" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
            <p class="auth-link">Уже есть аккаунт? <a href="/">Войти</a></p>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
