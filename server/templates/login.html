<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Eon</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Eon</h1>
            <h2>Вход</h2>
            <div id="error-message" class="error-message hidden"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <div id="2fa-group" class="form-group hidden">
                    <label for="2fa-code">Код из Google Authenticator</label>
                    <input type="text" id="2fa-code" name="2fa-code" placeholder="000000" inputmode="numeric" maxlength="6">
                </div>
                <button type="submit" class="btn-primary" id="login-btn">Войти</button>
            </form>
            <p class="auth-link">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
